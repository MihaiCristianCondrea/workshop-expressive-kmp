# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow builds the Kotlin Multiplatform modules on the targets we support
# for local component validation: Desktop/JVM, Android, iOS simulator, JS, and Wasm.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop-jvm-tests
            target: :shared-ui:jvmTest :catalog:jvmTest
            os: ubuntu-latest
          - name: android-compile
            target: :shared-ui:compileAndroidMain :catalog:compileAndroidMain
            os: ubuntu-latest
          - name: js-compile
            target: :shared-ui:compileKotlinJs :catalog:compileKotlinJs
            os: ubuntu-latest
          - name: wasm-compile
            target: :shared-ui:compileKotlinWasmJs :catalog:compileKotlinWasmJs :webApp:compileKotlinWasmJs
            os: ubuntu-latest
          - name: ios-simulator-tests
            target: :shared-ui:iosSimulatorArm64Test :catalog:iosSimulatorArm64Test
            os: macos-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew --no-configuration-cache ${{ matrix.target }}
